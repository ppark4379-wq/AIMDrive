schema: aimdrive_tunnel_static_config_v1
map: R_KR_PR_K-city_2025

# Explicit experimental configuration; tunnel_static.yaml stays unchanged.
selected_pattern: short_detour
footprint_domain: two_lane_physical_road
station_window_m: [20.0, 105.0]
lateral_regions: null
available_patterns:
  - short_detour
  - asymmetric_return
  - long_group_bypass
  - independent_detours
  - alternating_three
  - window_bypass
actor_count_caps:
  short_detour: [1]
  asymmetric_return: [1]
  long_group_bypass: [1, 2, 3]
  independent_detours: [2]
  alternating_three: [3]
  window_bypass: [2, 3]
experimental_three_requires_explicit_count_and_allow_three: true
static_yaw_offsets_deg:
  Steel_Barricade: [90.0]
  concrete-barrier: [90.0]
  Rockslide: []

layout:
  station_min_m: 20.0
  station_max_m: 105.0
  min_pair_gap_m: 18.0
  lateral_limit_m: 0.25
  # Eligibility uses the yaw-projected width; whole polygons still govern.
  max_width_m: 6.7

models:
  static_catalog: config/static_obstacle_footprints_v1.json
  vehicle_registry: ../data_collection/internal_sensor_record/evidence/object_geometry_registry_default3d_v2/registry.json
  # Runtime catalogues are supplied only after native-scale geometry audit.
  runtime_catalog: null

screening:
  planner: production_JammingPlanner
  recorded_routes: 9
  time_budget_sec: 15.0
  road_boundary_approach_m: 120.0
  road_boundary_departure_m: 70.0
  central_line_crossing_allowed: true

preview:
  hold_seconds: 10.0

campaign:
  patterns:
    - short_detour
    - asymmetric_return
    - long_group_bypass
    - independent_detours
    - alternating_three
    - window_bypass
  require_measured_jamming_path: true
  require_actual_drive_evidence: true
