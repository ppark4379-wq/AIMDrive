TargetHz: 30

# Position only. Shared sensors -> improved DR -> the common Expert.
Localization:
  enabled: true
  config: Localization/config.yaml
  record_dir: null  # optional new directory, relative to AIM2026; never overwrite logs

Ego:
  ip:
  vehicle_status_port: 8000  # Competition Vehicle Status (MORAI Host 8001 -> here)
  cmd_port:                  # VE perception sends no control; the Expert does
  ctrl_mode: 2
  cmd_type: 1
  gear: 4

Weight_Path:
  VE:
  Connector:
  LLM:

GPS:
  ip: 127.0.0.1
  bind: 127.0.0.1
  host_port: 7506
  dest_port: 9090
  pos: [0.0, 0.0, 0.0]
  rot_deg: [0.0, 0.0, 0.0]

IMU:
  ip: 127.0.0.1
  bind: 127.0.0.1
  host_port: 7507
  dest_port: 9090
  pos: [0.0, 0.0, 0.0]
  rot_deg: [0.0, 0.0, 0.0]

LiDAR:
  ip: 127.0.0.1
  bind: 127.0.0.1
  host_port: 2369
  dest_port: 2368
  pos: [1.0, 0.0, 1.48]
  rot_deg: [0.0, 0.0, 0.0]

Camera:
  Cam_Front:
    ip: 127.0.0.1
    bind: 127.0.0.1
    host_port: 7501
    dest_port: 9090
    width: 1280
    height: 720
    fov: 90
    pos: [1.9, 0.0, 1.2]
    rot_deg: [0.0, 2.0, 0.0]

  Cam_Left:
    ip: 127.0.0.1
    bind: 127.0.0.1
    host_port: 7502
    dest_port: 9090
    width: 640
    height: 480
    fov: 130
    pos: [1.15, 0.65, 1.2]
    rot_deg: [0.0, 10.0, 70.0]

  Cam_Right:
    ip: 127.0.0.1
    bind: 127.0.0.1
    host_port: 7503
    dest_port: 9090
    width: 640
    height: 480
    fov: 130
    pos: [1.15, -0.65, 1.2]
    rot_deg: [0.0, 10.0, 290.0]

  Cam_Rear:
    ip: 127.0.0.1
    bind: 127.0.0.1
    host_port: 7504
    dest_port: 9090
    width: 640
    height: 480
    fov: 90
    pos: [-0.14, 0.0, 1.2]
    rot_deg: [0.0, 2.0, 180.0]

# MORAI UDP sign confirmed by the user: positive steering turns left.
Control:
  positive_steer: left  # normalized command, not radians
  max_speed_mps: null  # null retains LMDrive's waypoint-derived target speed

# VE detections + control pose -> the Expert, on this host (Inference/main.py).
Detection:
  ip: 127.0.0.1
  port: 12050
  pose_hz: 50  # GPS position / IMU heading / status speed, independent of VE
  # checkpoint_sha256 is filled from Inference.vision.checkpoint at start.

Inference:
  device: cuda
  cpu_threads: 4
  status_file: AIM2026/outputs/live/ve_status.json
  status_interval_s: 2.0
  vision:
    checkpoint: P1          # label in Inference/vision/checkpoint.py (file in Weights/VE)
    object_head: null       # null | truck (Weights/VE/object_head_truck_20261024.pt: truck-aware boxes + fragment merge)
    signal_head: true       # P1 three-phase signal head (Weights/VE/signal_head_p1_20261014.pt)
    max_sensor_age_s: 0.5   # older camera/LiDAR/GPS/IMU/status -> not-ready packet
