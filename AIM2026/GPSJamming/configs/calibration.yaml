  rear:
    camera_name: rear
    position_m: [-0.14, 0.0, 1.2]
    rotation_rpy_deg: [0.0, 2.0, 180.0]
    horizontal_fov_deg: 90.0
    intrinsic:
      - [320.0, 0.0, 320.0]
      - [0.0, 320.0, 240.0]
      - [0.0, 0.0, 1.0]
    distortion: null
    extrinsic:
      - [0.0, 1.0, 0.0, 0.0]
