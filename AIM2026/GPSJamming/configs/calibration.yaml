# Four MORAI cameras; see docs/camera_calibration.md for specifications.
# Ideal pinhole, square pixels, centered principal point, no distortion.
# Vehicle/base_link: X forward, Y left, Z up. Positive pitch points down.
# Camera optical: X right, Y down, Z forward. Translation in metres.
# R = optical_axes @ (Rz(yaw) @ Ry(pitch) @ Rx(roll)).T; t = -R @ position.
# p_camera_optical = extrinsic @ p_base_link_homogeneous.
# Pose/FOV metadata is descriptive; changing it does not recalculate matrices.
# Assumes the supplied vehicle origin is base_link; validate with image overlays.
cameras:
  front:
    camera_name: front
    position_m: [1.9, 0.0, 1.2]
    rotation_rpy_deg: [0.0, 2.0, 0.0]
    horizontal_fov_deg: 90.0
    intrinsic:
      - [640.0, 0.0, 640.0]
      - [0.0, 640.0, 360.0]
      - [0.0, 0.0, 1.0]
    distortion: null
    extrinsic:
      - [0.0, -1.0, 0.0, 0.0]
      - [-0.034899496703, 0.0, -0.999390827019, 1.265578036158]
      - [0.999390827019, 0.0, -0.034899496703, -1.856963175293]
      - [0.0, 0.0, 0.0, 1.0]
    source_frame: base_link
    image_size: [1280, 720]

  front_right:
    camera_name: front_right
    position_m: [1.15, -0.65, 1.2]
    rotation_rpy_deg: [0.0, 10.0, 290.0]
    horizontal_fov_deg: 130.0
    intrinsic:
      - [149.2184506096, 0.0, 320.0]
      - [0.0, 149.2184506096, 240.0]
      - [0.0, 0.0, 1.0]
    distortion: null
    extrinsic:
      - [-0.939692620786, -0.342020143326, 0.0, 0.858333420742]
      - [-0.059391174614, 0.163175911167, -0.984807753012, 1.356133496679]
      - [0.336824088833, -0.925416578398, -0.173648177667, -0.780490664917]
      - [0.0, 0.0, 0.0, 1.0]
    source_frame: base_link
    image_size: [640, 480]

  front_left:
    camera_name: front_left
    position_m: [1.15, 0.65, 1.2]
    rotation_rpy_deg: [0.0, 10.0, 70.0]
    horizontal_fov_deg: 130.0
    intrinsic:
      - [149.2184506096, 0.0, 320.0]
      - [0.0, 149.2184506096, 240.0]
      - [0.0, 0.0, 1.0]
    distortion: null
    extrinsic:
      - [0.939692620786, -0.342020143326, 0.0, -0.858333420742]
      - [-0.059391174614, -0.163175911167, -0.984807753012, 1.356133496679]
      - [0.336824088833, 0.925416578398, -0.173648177667, -0.780490664917]
      - [0.0, 0.0, 0.0, 1.0]
    source_frame: base_link
