[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gps-jamming"
version = "0.1.0"
description = "LiDAR tunnel wall boundary detection and UDP transport"
readme = "README.md"
requires-python = ">=3.8"
dependencies = ["numpy>=1.23", "PyYAML>=6"]

[project.scripts]
gps-jamming = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "visualization", "config"]
namespaces = true

[tool.setuptools.package-data]
config = ["perception.yaml"]
visualization = ["lidar.rviz", "run_ros1.sh"]
