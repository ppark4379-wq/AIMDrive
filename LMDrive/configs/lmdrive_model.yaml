# LMDrive driving model: frozen vision encoder + Q-Former + LLaMA-family LLM.
# Same settings as lavis/projects/lmdrive/notice_llava15_visual_encoder_r50_seq40.yaml of the original LMDrive.
vision_encoder_config: configs/vision_encoder_model.yaml
vision_encoder_checkpoint: data/external/LMDrive-vision-encoder-r50-v1.0/vision-encoder-r50.pth.tar
freeze_vision_encoder: true
freeze_vision_encoder_decoder: true
vision_encoder_chunks: 2                  # frames of a clip are encoded in this many chunks to bound memory

llm_model_path: data/external/llava-v1.5-7b   # local folder or Hugging Face id (LLaVA-v1.5, Vicuna-v1.5, LLaMA)
use_lora: false                           # true needs peft

qformer_bert_path: bert-base-uncased      # local folder or Hugging Face id used to initialise the Q-Former
num_query_tokens: 4                       # tokens per frame passed to the LLM
max_text_length: 64

use_notice_prompt: true                   # insert notice instructions in the middle of a clip
use_frame_position_prompt: false          # wrap each frame as "<frame x,y> ... </frame>"
use_gru_waypoint_decoder: false           # GRU waypoint head instead of the MLP head
