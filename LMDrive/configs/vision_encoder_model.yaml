# Vision encoder architecture: LMDrive "memfuser_baseline_e1d3", the released R50 encoder.
# Stage 1 trains it; configs/lmdrive_model.yaml reuses this file for the frozen encoder of stage 2.
name: memfuser_baseline_e1d3
rgb_backbone: resnet50d         # resnet50d | resnet26d | resnet18d
pretrained_backbone: true       # start the camera CNN from timm ImageNet weights (torch hub cache)
pretrained_backbone_path: ""    # optional local copy of resnet50d_ra2-464e36ba.pth for offline machines
embed_dim: 256
enc_depth: 1
dec_depth: 3
num_heads: 8
dim_feedforward: 2048
dropout: 0.1
