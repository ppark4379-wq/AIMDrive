# Exact (zone, label, instruction_state) mapping. null label means rule-only.
# Dynamic obstacle has no Expert-sourced label (no Expert state contract
# exists for it): its instruction_state values are themselves the only
# label dimension, so every dynamic_obstacle row below uses label: null.
static_obstacle:
  - {label: null, state: normal, instruction_id: static_normal}
  - {label: null, state: approach_maintain, instruction_id: static_approach_maintain}
  - {label: null, state: avoid, instruction_id: static_avoid}
  - {label: null, state: avoid_continue, instruction_id: static_avoid_continue}
  - {label: null, state: pass_avoidance_corridor, instruction_id: static_pass_avoidance_corridor}
  - {label: null, state: pass_between, instruction_id: static_pass_between}
  - {label: null, state: return_to_path, instruction_id: static_return_to_path}
  - {label: approach, state: approach_maintain, instruction_id: approach}
  - {label: approach, state: normal, instruction_id: approach_normal}
  - {label: follow, state: approach_maintain, instruction_id: follow_approach_maintain}
  - {label: drive_approach, state: approach_maintain, instruction_id: drive_approach}
  - {label: follow, state: avoid, instruction_id: follow_avoid}
  - {label: follow, state: avoid_continue, instruction_id: follow_avoid_continue}
  - {label: follow, state: pass_avoidance_corridor, instruction_id: follow_pass}
  - {label: follow, state: keep_path, instruction_id: follow_keep_path}
  - {label: follow, state: pass_between, instruction_id: follow_between}
  - {label: follow, state: return_to_path, instruction_id: recover_alignment}
  - {label: follow, state: normal, instruction_id: normal}
  - {label: rejoined, state: return_to_path, instruction_id: rejoined_return_to_path}
  - {label: rejoined, state: normal, instruction_id: rejoined_normal}
