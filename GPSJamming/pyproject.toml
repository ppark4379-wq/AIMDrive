[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gps-jamming"
version = "0.1.0"
description = "Camera and LiDAR rule-based perception"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23", "scipy>=1.9", "PyYAML>=6"]

[project.optional-dependencies]
viewer = ["open3d>=0.18,<0.20"]

[tool.setuptools.packages.find]
where = ["."]
include = ["gps_jamming*"]
