[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aimdrive-morai"
version = "0.1.0"
description = "MORAI competition runtime contracts for Route-Conditioned VLDrive development"
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.20",
]

[tool.setuptools.packages.find]
where = ["src"]
