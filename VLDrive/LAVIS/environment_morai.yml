name: vldrive_morai
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.8
  - pytorch=2.0.1
  - torchvision=0.15.2
  - pytorch-cuda=11.8
  - numpy=1.24.4
  - scipy=1.10.1
  - pillow=10.4
  - pyyaml=6.0.3
  - pyproj=3.5
  - matplotlib=3.7.5
  - pip
  - pip:
      - --find-links https://data.pyg.org/whl/torch-2.0.1+cu118.html
      - transformers==4.31.0
      - tokenizers==0.13.3
      - huggingface-hub==0.23.5
      - safetensors==0.4.5
      - sentencepiece==0.1.99
      - opencv-python-headless==4.5.5.64
      - torch-scatter==2.1.2+pt20cu118
# timm and the Q-Former/DDIA implementation are loaded from this team's VLDrive
# checkout by lavis.common.morai_runtime.bootstrap. Do not install upstream pip timm over it.
