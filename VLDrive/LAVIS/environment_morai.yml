name: vldrive_morai
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.10
  # RTX 50-series requires a Blackwell-capable build.  The validated local
  # environment currently uses torch 2.8.0+cu128 / torchvision 0.23.0+cu128.
  - numpy=1.26.4
  - scipy
  - pillow=10.4
  - pyyaml=6.0.3
  - pyproj
  - matplotlib=3.7.5
  - pandas=2.2.3
  - pytest=8.3.5
  - pip
  - pip:
      - torch==2.8.0
      - torchvision==0.23.0
      - transformers==4.31.0
      - tokenizers==0.13.3
      - huggingface-hub==0.23.5
      - safetensors==0.4.5
      - sentencepiece==0.1.99
      - opencv-python-headless==4.5.5.64
      - iopath==0.1.10
      - omegaconf==2.3.0
# torch-scatter is intentionally omitted: its current wheel requires a newer
# glibc than Ubuntu 20.04.  The vendored PointPillar uses a PyTorch fallback.
# timm and Q-Former/DDIA come from this repository, never upstream pip timm.
