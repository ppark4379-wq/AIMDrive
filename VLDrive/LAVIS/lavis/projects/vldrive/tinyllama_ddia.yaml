model:
  arch: vldrive
  tinyllama_model_name_or_path: ../weights/TinyLlama-1.1B-intermediate-step-1431k-3T
  tinyllama_cache_dir: null
  local_files_only: true
  freeze_tinyllama: false
  use_ddia: true
  visual_feature_dim: 256
  language_hidden_dim: auto
  use_visual_projection: true
  # IMPLEMENTATION CHOICE: the VLDrive paper does not specify the exact dtype.
  precision: fp16
  max_instruction_length: 64
  debug_vldrive: false
  load_pretrained: false

run:
  task: carla_drive
  init_lr: 1.0e-5
  weight_decay: 0.06
  max_epoch: 15
  batch_size_train: 1
  batch_size_eval: 1
  amp: true
  output_dir: output/vldrive/tinyllama_ddia
  device: cuda
  distributed: true
